<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="院内検索"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>院内資料検索</title>
<style>
:root{--bg:#f7f7fa;--card:#fff;--tx:#0f1222;--mu:#7a7f93;--ac:#4f46e5;--bd:#e7e8ee;--hl:#e4e0ff;--wa:#b45309;--seg:#ececf2;--chip:#eef0f6}
@media(prefers-color-scheme:dark){:root{--bg:#0c0e14;--card:#14171f;--tx:#eceef6;--mu:#8d93a8;--ac:#8b8cf8;--bd:#232733;--hl:#3a3680;--wa:#fbbf24;--seg:#1b1e28;--chip:#1d212c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"Hiragino Sans",sans-serif;padding-bottom:40px}
.wrap{max-width:980px;margin:0 auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
h1{font-size:18px;margin:0 0 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}h1 small{color:var(--mu);font-weight:400;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=password],input[type=number],select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;font-size:16px}
#q{flex:1;min-width:200px;font-size:17px;padding:12px 16px;border-radius:14px}
button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 18px;font-size:15px;font-weight:600}
button.sub{background:transparent;color:var(--ac);border:1px solid var(--bd);padding:6px 11px;font-size:13px;font-weight:500;border-radius:10px}
.filters{margin:10px 0;color:var(--mu);font-size:13px}.filters select{font-size:14px;padding:8px}.filters label{display:flex;gap:5px;align-items:center}
#stat{font-size:12px;color:var(--mu);margin:6px 0 12px;min-height:16px}
.card{background:transparent;border:0;border-top:1px solid var(--bd);border-radius:0;padding:16px 2px;margin:0;display:flex;gap:14px}
#seg{display:flex;gap:3px;background:var(--seg);padding:3px;border-radius:12px;margin:12px 0 6px}#seg button{flex:1;white-space:nowrap;background:transparent;color:var(--mu);border-radius:9px;padding:8px 2px;font-size:12.5px;font-weight:500}#seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(15,18,34,.14)}
#src{display:none}
.cv{width:62px;height:auto;align-self:flex-start;border:1px solid var(--bd);border-radius:5px;background:#fff;flex:none;box-shadow:0 2px 6px rgba(15,18,34,.10)}.cv0{width:62px;height:82px;align-self:flex-start;border:1px dashed var(--bd);border-radius:4px;color:var(--mu);font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
.rk{min-width:22px;color:var(--mu);font-weight:600;padding-top:2px}
.main{flex:1;min-width:0}.title{font-weight:600;font-size:16px;word-break:break-all;letter-spacing:.01em}
.sz{font-size:11px;opacity:.85;white-space:nowrap}.meta{font-size:12px;color:var(--mu);margin:2px 0 6px;word-break:break-all}
.snip{font-size:13.5px;opacity:.9;word-break:break-all}
mark{background:var(--hl);color:inherit;border-radius:4px;padding:0 2px}
.chips{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;border:0;border-radius:8px;padding:5px 11px;background:var(--chip);color:var(--tx);cursor:pointer}.chip.best{background:var(--tx);color:var(--bg);font-weight:600}
.bar{display:none}
.act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}.empty{color:var(--mu);text-align:center;padding:40px 0}
#settings{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;overflow:auto}
#settings .box{background:var(--card);max-width:560px;margin:5vh auto;padding:18px;border-radius:12px}
#settings label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}#settings input[type=text],#settings input[type=password]{width:100%}
#viewer{display:none;position:fixed;inset:0;background:var(--bg);z-index:20;flex-direction:column}
#vbar{display:flex;gap:6px;align-items:center;padding:8px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--bd);flex-wrap:wrap;background:var(--card)}
#vtitle{flex:1;min-width:120px;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vbody{flex:1;overflow:auto;padding:4px;-webkit-overflow-scrolling:touch}#vpages{position:relative;width:max-content;margin:0 auto}.pg{position:relative;background:#fff;margin:0 0 6px;box-shadow:0 0 0 1px var(--bd)}.pg canvas{display:block;width:100%;height:100%}
#vpage{width:64px;padding:6px}
#seg{overflow-x:auto;-webkit-overflow-scrolling:touch}#seg button{flex:1 0 auto;padding:11px 20px;font-size:14.5px;min-width:96px}
#dscrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,320px);background:var(--card);z-index:41;transform:translateX(-102%);transition:transform .22s ease;padding:16px;padding-top:max(16px,env(safe-area-inset-top));overflow:auto;border-right:1px solid var(--bd)}
#drawer.open{transform:none}#drawer h2{font-size:15px;margin:0 0 4px}.dhint{font-size:12px;color:var(--mu);margin:0 0 12px}
.drow{display:flex;gap:6px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}.dname{flex:1;font-weight:600;word-break:break-all}.dname small{color:var(--mu);font-weight:400}.dempty{color:var(--mu);font-size:13px;padding:8px 0}
#dnew{width:100%;margin-top:14px}
#fed{display:none;position:fixed;inset:0;background:var(--bg);z-index:50;flex-direction:column}
#fhead{display:flex;gap:8px;align-items:center;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--bd);background:var(--card)}#ftitle{flex:1;text-align:center;font-weight:600}
#ftools{padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--bd)}
#flist{flex:1;overflow:auto;padding:0 12px;-webkit-overflow-scrolling:touch}
.frow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.frow input{width:22px;height:22px;flex:none}.ft{flex:1;word-break:break-all;font-size:14px}
.fcv{width:30px;height:40px;object-fit:cover;border-radius:3px;border:1px solid var(--bd);flex:none}.fcv0{width:30px;height:40px;border:1px dashed var(--bd);border-radius:3px;flex:none}
#shelf{display:none;position:fixed;inset:0;background:var(--bg);z-index:15;flex-direction:column}
#shead{display:flex;gap:8px;align-items:center;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--bd);background:var(--card)}
#stools{padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--bd)}
#slist{flex:1;overflow:auto;padding:0 12px;-webkit-overflow-scrolling:touch}
.srow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);align-items:center}.sright{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex:none}.sright .sgn,.sright .sbtns{display:flex;gap:5px;flex-wrap:nowrap;margin:0}.sright button{white-space:nowrap;padding:5px 9px;font-size:12px}.smain{flex:1;min-width:0}.sname{font-weight:600;word-break:break-all}.smeta{font-size:12px;color:var(--mu);margin:0}
.sgn{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.sbtns{display:flex;gap:6px;flex-wrap:wrap}.sok{font-size:12px;color:var(--mu)}
.srow .fcv,.srow .fcv0{width:34px;height:46px}
</style></head><body>
<div id="dscrim"></div>
<div id="drawer"><h2>マイフォルダ</h2><button class="sub" id="dshelf" style="width:100%;margin-bottom:14px;padding:10px">📚 本棚（本の一覧・GoodNotesリンク）</button><p class="dhint">よく使う本だけを選んで、検索の範囲にできます。</p><div id="dlist"></div><button id="dnew">＋ フォルダを作る</button>
<div style="margin-top:22px;border-top:1px solid var(--bd);padding-top:12px"><div class="dhint" style="margin:0 0 6px">PCと共有する（Google Drive経由）。PCとiPadで<b>同じ共有名</b>を入れます。空にすると共有しません。</div>
<input id="dkey" type="text" placeholder="共有名（例：hota）" style="width:100%"><button class="sub" id="dkeysave" style="margin-top:6px;width:100%">保存して同期</button><div id="dmsg" style="font-size:12px;color:var(--mu);margin-top:6px"></div></div></div>
<div id="shelf"><div id="shead"><button class="sub" id="sclose">閉じる</button><div style="flex:1;text-align:center;font-weight:600">📚 本棚</div><span id="scount" style="font-size:12px;color:var(--mu)"></span></div>
<div id="stools"><input id="sq" type="text" placeholder="本を検索（書名・フォルダ名）"><div class="row" style="font-size:13px"><label style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="snl">リンク未登録だけ</label><label style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="srn">雑誌も表示</label></div></div>
<div id="slist"></div></div>
<div id="fed"><div id="fhead"><button class="sub" id="fcancel">キャンセル</button><div id="ftitle">フォルダを作る</div><button id="fsave">保存</button></div>
<div id="ftools"><input id="fname" type="text" placeholder="フォルダ名（例：当直で使う本）"><input id="fq" type="text" placeholder="本を絞り込む">
<div class="row"><button class="sub" id="fall">表示中を全部選択</button><button class="sub" id="fnone">表示中を全部解除</button><label style="font-size:13px;display:flex;gap:5px;align-items:center"><input type="checkbox" id="frn">雑誌も表示</label><span id="fcount" style="font-size:13px;color:var(--mu);margin-left:auto"></span></div></div>
<div id="flist"></div></div>
<div class="wrap">
<h1><button class="sub" id="menubtn" aria-label="メニュー" style="font-size:18px;padding:4px 10px">☰</button>院内資料検索<small id="info"></small><span style="flex:1"></span><button class="sub" id="syncbtn">索引を更新</button><button class="sub" id="setbtn">設定</button></h1>
<div class="row"><input id="q" type="text" placeholder="例：急性膵炎の治療　/　膵炎 経腸栄養 いつから" autofocus><button id="go">検索</button></div>
<div id="seg"></div>
<div class="row filters">
 <select id="src"><option value="">すべて</option><option value="院内資料">院内資料</option><option value="雑誌">雑誌</option><option value="参考書">参考書</option></select>
 <select id="t1"><option value="">すべての分類</option></select>
 <select id="t2"><option value="">すべての科/種別</option></select>
 <select id="ext"><option value="">全形式</option><option value="pdf">PDF</option><option value="pptx">PowerPoint</option><option value="docx">Word</option><option value="xlsx">Excel</option></select>
 <select id="yf"><option value="0">全年度（院内資料のみに適用）</option><option value="2020">2020年以降</option><option value="2022">2022年以降</option><option value="2024">2024年以降</option></select>
 <label><input type="checkbox" id="pn" checked>新しい資料を優先</label>
</div>
<div id="stat">読み込み中…</div><div id="res"></div></div>

<div id="settings"><div class="box">
 <b>設定</b>
 <label>Google「Client ID」（Google Cloudで作成。手順書参照）</label><input id="s_cid" type="text" autocomplete="off">
 <label>Gemini APIキー（質問の意味検索用。この端末にだけ保存）</label><input id="s_key" type="password" autocomplete="off">
 <label>ログインに使うGoogleアカウント（任意。別のアカウントで自動ログインされてしまうとき、ここにメールアドレスを入れます）</label><input id="s_hint" type="text" autocomplete="off" placeholder="例: ○○@gmail.com">
 <label>Drive上の索引フォルダ名</label><input id="s_fold" type="text">
 <label>Drive上の資料フォルダ名（院内資料 / 参考書）</label><div class="row"><input id="s_rh" type="text" style="flex:1"><input id="s_rb" type="text" style="flex:1"></div>
 <label>GoodNotesで開く本（1行に「ファイル名=共有リンク」。例: biochemistry.pdf=https://share.goodnotes.com/s/…。この端末にだけ保存されます）</label><textarea id="s_gn" rows="4" style="width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;font-size:14px" placeholder="biochemistry.pdf=https://share.goodnotes.com/s/…"></textarea>
 <label><input type="checkbox" id="s_fake"> テスト用（意味検索にダミーを使う）</label>
  <label>保存済みの本（この端末。次回からDriveを使わず即開けます）</label><div id="s_saved"></div>
 <label>Google Cloudに登録する「リダイレクトURI」はこれです:</label><div id="s_redir" style="font-size:12px;word-break:break-all;user-select:all"></div>
 <div class="row" style="margin-top:14px"><button id="s_save">保存</button><button class="sub" id="s_close">閉じる</button></div>
</div></div>

<div id="viewer"><div id="vbar">
 <button class="sub" id="vclose">閉じる</button><div id="vtitle"></div>
 <button class="sub" id="vprev">◀</button><input id="vpage" type="number" min="1"><span id="vstat" style="font-size:12px;color:var(--mu)"></span><button class="sub" id="vnext">▶</button>
 <button class="sub" id="vzout">－</button><button class="sub" id="vzin">＋</button><button class="sub" id="vsave">📥 保存</button><button class="sub" id="vdrive">Driveで開く</button>
</div><div id="vbody"><div id="vpages"></div></div></div>
<script src="app.js"></script></body></html>
